---
openapi: 3.0.1
info:
  title: API V1
  version: v1
servers:
- url: http://localhost:3000
  description: Default server
paths:
  "/health":
    get:
      summary: Returns API health status
      tags:
      - Health
      responses:
        '200':
          description: health status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                - status
  "/me/profile":
    patch:
      summary: update user profile
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      tags:
      - Profile
      responses:
        '204':
          description: user profile is updated
        '422':
          description: profile is invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                age:
                  type: integer
                weight:
                  type: number
                  format: float
                best_5k_seconds:
                  type: integer
                best_half_seconds:
                  type: integer
                best_full_seconds:
                  type: integer
                target_race_type:
                  type: string
                target_time_seconds:
                  type: integer
                race_date:
                  type: string
                  format: date
              required:
              - age
              - weight
              - target_race_type
              - target_time_seconds
              - race_date
    get:
      summary: get user profile
      tags:
      - Profile
      responses:
        '404':
          description: user profile is not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: profile not found
                required:
                - error
        '200':
          description: user profile is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  age:
                    type: integer
                  weight:
                    type: number
                    format: float
                  best_5k_seconds:
                    type: integer
                  best_half_seconds:
                    type: integer
                  best_full_seconds:
                    type: integer
                  target_race_type:
                    type: string
                  target_time_seconds:
                    type: integer
                  race_date:
                    type: string
                    format: date
                required:
                - age
                - weight
                - target_race_type
                - target_time_seconds
                - race_date
  "/csrf":
    get:
      summary: Returns a CSRF token for OAuth forms and state-changing API requests
      tags:
      - Sessions
      responses:
        '200':
          description: CSRF token returned for same-origin requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                required:
                - csrf_token
  "/me":
    get:
      summary: Returns current user
      tags:
      - Sessions
      responses:
        '200':
          description: current user returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        nullable: true
                        example: Test User
                      email:
                        type: string
                        nullable: true
                        example: test@example.com
                      image:
                        type: string
                        nullable: true
                        example: https://example.com/avatar.png
                    required:
                    - id
                    - name
                    - email
                    - image
                required:
                - user
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unauthorized
                required:
                - error
  "/logout":
    delete:
      summary: Log out current user
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      tags:
      - Sessions
      responses:
        '204':
          description: logged out
  "/training_records":
    get:
      summary: list training records
      tags:
      - TrainingRecords
      responses:
        '200':
          description: training records returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  training_records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        date:
                          type: string
                          format: date
                        training_type:
                          type: string
                        description:
                          type: string
                          nullable: true
                        distance_km:
                          type: number
                          format: float
                          nullable: true
                        duration_minutes:
                          type: integer
                          nullable: true
                        pace:
                          type: string
                          nullable: true
                        completed:
                          type: boolean
                        feedback:
                          type: string
                          nullable: true
                        notes:
                          type: string
                          nullable: true
                      required:
                      - id
                      - date
                      - training_type
                      - description
                      - distance_km
                      - duration_minutes
                      - pace
                      - completed
                      - feedback
                      - notes
                required:
                - training_records
    post:
      summary: create training records
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      tags:
      - TrainingRecords
      responses:
        '200':
          description: training records created
          content:
            application/json:
              schema:
                type: object
                properties:
                  training_records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        date:
                          type: string
                          format: date
                        training_type:
                          type: string
                        description:
                          type: string
                          nullable: true
                        distance_km:
                          type: number
                          format: float
                          nullable: true
                        duration_minutes:
                          type: integer
                          nullable: true
                        pace:
                          type: string
                          nullable: true
                        completed:
                          type: boolean
                        feedback:
                          type: string
                          nullable: true
                        notes:
                          type: string
                          nullable: true
                      required:
                      - id
                      - date
                      - training_type
                      - description
                      - distance_km
                      - duration_minutes
                      - pace
                      - completed
                      - feedback
                      - notes
                required:
                - training_records
        '404':
          description: profile not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: profile not found
                required:
                - error
        '422':
          description: openai service error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid request
                required:
                - error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 1
                  example: 7
                training_days:
                  type: array
                  items:
                    type: string
                    enum:
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  example:
                  - monday
                  - wednesday
                  - saturday
                request_message:
                  type: string
                  nullable: true
                  example: 無理のない範囲で組んでください
              required:
              - days
              - training_days
  "/training_records/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: delete a training record
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      tags:
      - TrainingRecords
      responses:
        '204':
          description: training record deleted
    patch:
      summary: update a training record
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      tags:
      - TrainingRecords
      responses:
        '200':
          description: training record updated
  "/training_records/today":
    get:
      summary: get today's training record
      tags:
      - TrainingRecords
      responses:
        '200':
          description: today's training record returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  training_record:
                    type: object
                    nullable: true
                    properties:
                      id:
                        type: string
                        format: uuid
                      date:
                        type: string
                        format: date
                      training_type:
                        type: string
                      description:
                        type: string
                        nullable: true
                      distance_km:
                        type: number
                        format: float
                        nullable: true
                      duration_minutes:
                        type: integer
                        nullable: true
                      pace:
                        type: string
                        nullable: true
                      completed:
                        type: boolean
                      feedback:
                        type: string
                        nullable: true
                      notes:
                        type: string
                        nullable: true
                    required:
                    - id
                    - date
                    - training_type
                    - description
                    - distance_km
                    - duration_minutes
                    - pace
                    - completed
                    - feedback
                    - notes
                required:
                - training_record
  "/training_records/stats":
    get:
      summary: get training record stats
      tags:
      - TrainingRecords
      parameters:
      - name: group_by
        in: query
        enum:
        - day
        - week
        - month
        example: week
        schema:
          type: string
        description: ":\n * `day` \n * `week` \n * `month` \n "
      responses:
        '200':
          description: training record stats returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  group_by:
                    type: string
                    enum:
                    - day
                    - week
                    - month
                  stats:
                    type: array
                    items:
                      type: object
                      properties:
                        period:
                          type: string
                        total_distance_km:
                          type: number
                          format: float
                        total_duration_minutes:
                          type: integer
                        training_count:
                          type: integer
                      required:
                      - period
                      - total_distance_km
                      - total_duration_minutes
                      - training_count
                required:
                - group_by
                - stats
components:
  schemas: {}
