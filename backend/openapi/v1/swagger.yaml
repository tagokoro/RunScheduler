---
openapi: 3.0.1
info:
  title: API V1
  version: v1
servers:
- url: http://localhost:3000
  description: Default server
paths:
  "/health":
    get:
      summary: Returns API health status
      tags:
      - Health
      responses:
        '200':
          description: health status returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required:
                - status
  "/me/profile":
    patch:
      summary: update user profile
      tags:
      - Profile
      parameters: []
      responses:
        '204':
          description: user profile is updated
        '422':
          description: profile is invalid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                age:
                  type: integer
                weight:
                  type: number
                  format: float
                best_5k_seconds:
                  type: integer
                best_half_seconds:
                  type: integer
                best_full_seconds:
                  type: integer
                target_race_type:
                  type: string
                target_time_seconds:
                  type: integer
                race_date:
                  type: string
                  format: date
              required:
              - age
              - weight
              - target_race_type
              - target_time_seconds
              - race_date
    get:
      summary: get user profile
      tags:
      - Profile
      responses:
        '404':
          description: user profile is not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: profile not found
                required:
                - error
        '200':
          description: user profile is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  age:
                    type: integer
                  weight:
                    type: number
                    format: float
                  best_5k_seconds:
                    type: integer
                  best_half_seconds:
                    type: integer
                  best_full_seconds:
                    type: integer
                  target_race_type:
                    type: string
                  target_time_seconds:
                    type: integer
                  race_date:
                    type: string
                    format: date
                required:
                - age
                - weight
                - target_race_type
                - target_time_seconds
                - race_date
  "/me":
    get:
      summary: Returns current user
      tags:
      - Sessions
      responses:
        '200':
          description: current user returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        nullable: true
                        example: Test User
                      email:
                        type: string
                        nullable: true
                        example: test@example.com
                      image:
                        type: string
                        nullable: true
                        example: https://example.com/avatar.png
                    required:
                    - id
                    - name
                    - email
                    - image
                required:
                - user
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unauthorized
                required:
                - error
  "/logout":
    delete:
      summary: Log out current user
      tags:
      - Sessions
      responses:
        '204':
          description: logged out
  "/training_plans":
    post:
      summary: create training plan
      tags:
      - TrainingPlans
      parameters: []
      responses:
        '200':
          description: training plan is generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  training_records:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        date:
                          type: string
                          format: date
                        training_type:
                          type: string
                        description:
                          type: string
                        distance_km:
                          nullable: true
                          type: number
                          format: float
                        duration_minutes:
                          nullable: true
                          type: integer
                        pace:
                          nullable: true
                          type: string
                        completed:
                          type: boolean
                        feedback:
                          nullable: true
                          type: string
                        notes:
                          type: string
                      required:
                      - id
                      - date
                      - training_type
                      - description
                      - distance_km
                      - duration_minutes
                      - pace
                      - completed
                      - feedback
                      - notes
                required:
                - training_records
        '404':
          description: profile is not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: profile not found
                required:
                - error
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 1
                training_days:
                  type: array
                  items:
                    type: string
                    enum:
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                request_message:
                  type: string
              required:
              - days
              - training_days
components:
  schemas: {}
