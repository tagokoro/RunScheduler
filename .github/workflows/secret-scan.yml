name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan all fetched history
        run: gitleaks git --redact --no-banner --log-opts="--all" .

      - name: Reject tracked secret files and runtime logs
        shell: python
        run: |
          import re
          import subprocess
          import sys

          pattern = re.compile(r'(^|/)(config/(master\.key|credentials/[^/]+\.key)|\.env(\.(?!example$)[^/]+)?|(log|tmp)/.+|[^/]+\.pem)$')
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          blocked = [path for path in paths if pattern.search(path) and not path.endswith('/.keep')]
          for path in blocked:
              print(f'Forbidden tracked file: {path}')
          sys.exit(bool(blocked))
