title = "RunScheduler secret detection"

[extend]
useDefault = true

[[rules]]
id = "rails-master-key-file"
description = "Rails master key must never be committed"
path = '''(^|/)config/(master\.key|credentials/[^/]+\.key)$'''
regex = '''[0-9a-fA-F]{32}'''

[[rules]]
id = "rails-master-key-assignment"
description = "Rails master key in environment variables"
regex = '''(?i)RAILS_MASTER_KEY\s*[:=]\s*["']?([0-9a-f]{32})\b'''
secretGroup = 1
